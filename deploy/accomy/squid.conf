# Egress allowlist for the Accomy bot container. This file replaces the image's squid.conf, whose
# default lets every private-network client reach every host.
#
# The bot may open HTTPS tunnels (CONNECT, port 443) to the hosts below, one tunnel to Amazon Transcribe's
# streaming port, and nothing else. A request for any other host, a bare IP address, plain HTTP or another
# port gets 403.

http_port 3128

acl bot_hosts dstdomain api.telegram.org
# Model endpoint (providers.newapi in the profile's config.yaml).
acl bot_hosts dstdomain newapi.mongoso.com
# Suppliers (plugins/accomy_travel: tmc_client, seatunique_client, geo, tools_places, tools_research).
acl bot_hosts dstdomain open.fusionconnectgroup.com
acl bot_hosts dstdomain api.sandbox.dev.seatunique.tech
acl bot_hosts dstdomain maps.googleapis.com
acl bot_hosts dstdomain places.googleapis.com
acl bot_hosts dstdomain weather.googleapis.com
acl bot_hosts dstdomain api.search.brave.com
# The demo payment page (payment-demo/): the bot voids a cancelled order's link and asks whether one was paid.
acl bot_hosts dstdomain 5c8l8j74j4.execute-api.ap-southeast-1.amazonaws.com
acl bot_hosts dstdomain dev-chatbot-payment.accomy-tech.com

# Speech-to-text for voice notes (plugins/accomy_travel/speech.py). Amazon Transcribe serves its WebSocket
# stream on port 8443 only. The host carries the region set as transcribe_region in the profile's config.yaml:
# change both together.
acl transcribe_host dstdomain transcribestreaming.ap-southeast-1.amazonaws.com
acl transcribe_port port 8443

acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access allow transcribe_host transcribe_port
http_access deny !https_port
http_access allow bot_hosts
http_access deny all

# A tunnel only: nothing is cached, and no ICMP probing of peers.
cache deny all
pinger_enable off
shutdown_lifetime 2 seconds
