# Egress allowlist for the Accomy bot container. This file replaces the image's squid.conf, whose
# default lets every private-network client reach every host.
#
# The bot may open HTTPS tunnels (CONNECT, port 443) to the hosts below and nothing else. A request for
# any other host, a bare IP address, plain HTTP or another port gets 403.

http_port 3128

acl bot_hosts dstdomain api.telegram.org
# Model endpoint (providers.newapi in the profile's config.yaml).
acl bot_hosts dstdomain newapi.mongoso.com
# Suppliers (plugins/accomy_travel: tmc_client, seatunique_client, geo, tools_places, tools_research).
acl bot_hosts dstdomain open.fusionconnectgroup.com
acl bot_hosts dstdomain api.sandbox.dev.seatunique.tech
acl bot_hosts dstdomain maps.googleapis.com
acl bot_hosts dstdomain places.googleapis.com
acl bot_hosts dstdomain weather.googleapis.com
acl bot_hosts dstdomain api.search.brave.com

acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access allow bot_hosts
http_access deny all

# A tunnel only: nothing is cached, and no ICMP probing of peers.
cache deny all
pinger_enable off
shutdown_lifetime 2 seconds
