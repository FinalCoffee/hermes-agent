# Accomy AI Travel profile. Secrets are not stored here: they live in the profile's .env (see
# distribution.yaml env_requires). Every key below is read by the code path named in its comment.

_config_version: 53

model:
  provider: newapi
  default: gpt-6.1-sol
  api_mode: codex_responses

providers:
  newapi:
    name: Accomy NewAPI
    api: https://newapi.mongoso.com/v1
    key_env: OPENAI_API_KEY
    api_mode: codex_responses
    discover_models: false
    models:
      # The model reads pictures. No catalog says so for a custom endpoint, and without this line a photo is
      # first described by a separate vision call and reaches the model as text (agent/image_routing.py).
      gpt-6.1-sol:
        supports_vision: true

agent:
  reasoning_effort: "medium"
  # Telegram is excluded from the coding posture already; set explicitly so `hermes chat` tests match.
  coding_context: "off"
  # Tool-calling rounds per message. A trip plan needs a handful; every round is a paid model call.
  max_turns: 12
  # Safety net that outlives any later edit to platform_toolsets (tools_config.py:639).
  disabled_toolsets:
    - terminal
    - process_manage
    - file
    - code_execution
    - browser
    - delegation
    - cronjob
    - memory
    - session_search
    - skills
    - todo
    - tts
    - vision
    - image_gen
    - computer_use
    - web
    - clarify

plugins:
  enabled:
    - accomy_travel
  entries:
    accomy_travel:
      settings:
        # Where the demo payment page is served (deploy/accomy/payment-demo). A confirmed order carries a link
        # to it when ACCOMY_PAYMENT_LINK_SECRET is set as well. Empty: orders carry no payment link.
        payment_url: "https://5c8l8j74j4.execute-api.ap-southeast-1.amazonaws.com"
        # Speech-to-text for voice notes, audio files and videos (plugins/accomy_travel/speech.py): the AWS
        # region whose Amazon Transcribe is used, and the languages it chooses from, the likeliest first and
        # one dialect per language. Needs ACCOMY_TRANSCRIBE_ACCESS_KEY_ID and ACCOMY_TRANSCRIBE_SECRET_ACCESS_KEY.
        # The proxy allows one Transcribe host (deploy/accomy/squid.conf): change the region there too.
        transcribe_region: ap-southeast-1
        transcribe_languages: [zh-TW, en-US, ja-JP, ko-KR]

# The plugin's 12 search tools and read_attachment, plus the five order tools when ACCOMY_DATABASE_URL is set.
# no_mcp stops globally enabled mcp_servers from joining (tools_config.py:747).
platform_toolsets:
  telegram:
    - accomy_travel
    - no_mcp
  cli:
    - accomy_travel
    - no_mcp

# The tool surface must be present on every call: deferred tools would hide behind tool_describe/tool_call.
tools:
  tool_search:
    enabled: "off"

# One profile serves many users, so nothing may persist or leak between them.
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
  provider: ""

skills:
  creation_nudge_interval: 0

auxiliary:
  background_review:
    enabled: false
  title_generation:
    enabled: false

curator:
  enabled: false

cron:
  allow_agent_scheduling: false

updates:
  check: false

checkpoints:
  enabled: false

# A voice note is transcribed before the turn by the plugin's provider, Amazon Transcribe
# (gateway/run_inbound_transcription.py, plugins/accomy_travel/speech.py). The provider does not read
# stt.language: Transcribe chooses among transcribe_languages above. The sender is shown what was heard.
stt:
  enabled: true
  provider: accomy-transcribe
  echo_transcripts: true

telemetry:
  shared_metrics:
    enabled: false

terminal:
  # Must be an existing empty directory; create it before enabling terminal. If it is missing, the local
  # terminal falls back to the nearest existing parent (your HOME) with only a log warning. The default "."
  # would load whatever project the gateway was started from into the prompt.
  cwd: "~/accomy-workspace"

# No first-contact offers or hints: they are written for a single owner, and showing one writes config.yaml.
onboarding:
  profile_build: "off"
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
    profile_build_offered: true

# /new runs at once. The confirm card it replaces offers "Always approve", which only an admin may use.
approvals:
  destructive_slash_confirm: false

# A message sent while a reply is being written waits its turn instead of aborting the reply.
display:
  busy_input_mode: queue

# Summarize a conversation at 60k tokens: the default for this model is 204k tokens on every call.
compression:
  threshold_tokens: 60000

gateway:
  # Closed by default: strangers get one polite refusal, not a pairing code. Open the bot with
  # gateway.allow_all_users or TELEGRAM_ALLOWED_USERS (see the plugin README).
  unauthorized_dm_behavior: decline
  unauthorized_dm_decline_message: "您好，Accomy 目前只開放給受邀的使用者。\nHello. Accomy is open to invited users only for now."
  # A reply may attach only files from the gateway's own cache: without these, a model talked into writing
  # MEDIA:/some/path uploads that host file to the chat (gateway/media_policy.py).
  strict: true
  trust_recent_files: false
  # Forum topics: one session per member, so members cannot interrupt or reset one another.
  thread_sessions_per_user: true
  # End users are not the operator: replies and the prompt leave out host paths, the install name and
  # model/provider details, and the locale overlay in locales/ supplies the wording.
  hide_operator_details: true
  max_concurrent_sessions: 8
  platforms:
    telegram:
      # Skips SOUL/AGENTS/.cursorrules discovery for messaging sessions (session_execution.py:42-54).
      skip_context_files: true
    # No API server. The container image writes an API_SERVER_KEY into .env on first boot, and a key
    # alone starts the OpenAI-compatible API server (gateway/config_env.py). The gateway's own session
    # listener on loopback is separate and stays.
    api_server:
      enabled: false

telegram:
  suggested_replies: true
  require_mention: true
  reactions: false
  # Photos, voice notes and files are downloaded into the gateway's media cache. The model sees a photo,
  # a voice note arrives as text, and a file is read on request by read_attachment. The plugin's inbound gate
  # limits files per sender and per day (plugins/accomy_travel/attachments.py).
  accept_attachments: true
  # Fail-closed owner placeholder: slash gating turns on only when an admin list is non-empty, and "0"
  # matches no Telegram user, so every sender gets only /help, /whoami and the list below.
  # Replace "0" with the owner's numeric Telegram ID (see the plugin README).
  allow_admin_from: ["0"]
  user_allowed_commands: [start, new, stop]
  group_allow_admin_from: ["0"]
  # No new/stop in groups: there they also act on other members' conversations.
  group_user_allowed_commands: [start]

platforms:
  telegram:
    extra:
      # The Telegram command menu lists only what an end user can run: exactly these four, in this order.
      command_menu:
        max_commands: 4
        priority_mode: replace
        priority: [start, new, stop, help]
